<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regresa — Pacoya Yoga</title>
  <meta name="description" content="Un lugar para volver a ti. Respiración, silencio y presencia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: rgba(122, 158, 126, 1);
      --text:  rgba(250, 247, 242, 0.82);
      --dim:   rgba(250, 247, 242, 0.28);
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: #0e0b07;
      color: var(--text);
      overflow: hidden;
    }

    /* ── NAV ── */
    .r-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 22px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .r-nav__logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: rgba(250,247,242,0.3);
      text-decoration: none;
      transition: color 0.4s;
    }
    .r-nav__logo:hover { color: rgba(250,247,242,0.6); }

    .r-nav__back {
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(250,247,242,0.2);
      text-decoration: none;
      transition: color 0.4s;
    }
    .r-nav__back:hover { color: rgba(250,247,242,0.5); }

    /* ── MODE SELECTOR ── */
    .mode-selector {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 6px;
      background: rgba(14,11,7,0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(250,247,242,0.07);
      border-radius: 100px;
      padding: 6px;
    }

    .mode-btn {
      background: none;
      border: none;
      border-radius: 100px;
      padding: 8px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: rgba(250,247,242,0.38);
      cursor: pointer;
      transition: background 0.4s, color 0.4s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: rgba(122,158,126,0.18);
      color: rgba(250,247,242,0.82);
    }

    /* ── HERO ── */
    .breath-hero {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .breath-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 55% 55% at 50% 50%, rgba(122,158,126,0.09) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Orb */
    .breath-orb {
      position: relative;
      z-index: 2;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(122,158,126,0.2) 0%, rgba(122,158,126,0.06) 55%, transparent 75%);
      box-shadow: 0 0 80px rgba(122,158,126,0.1), 0 0 160px rgba(122,158,126,0.05);
      will-change: transform, opacity;
    }

    .breath-orb::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 48%; height: 48%;
      border-radius: 50%;
      background: rgba(122,158,126,0.28);
      box-shadow: 0 0 28px rgba(122,158,126,0.35);
    }

    /* Pacoya wordmark */
    .breath-wordmark {
      position: relative;
      z-index: 3;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 300;
      color: rgba(250,247,242,0.82);
      letter-spacing: 0.07em;
      margin-top: 36px;
      will-change: transform, letter-spacing, opacity;
      user-select: none;
    }

    /* Phase label */
    .breath-label {
      position: relative;
      z-index: 3;
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 18px;
      height: 18px;
      transition: opacity 0.5s ease;
      user-select: none;
    }

    /* Progress dots for box breathing */
    .breath-dots {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 8px;
      margin-top: 28px;
      opacity: 0;
      transition: opacity 0.6s;
    }

    .breath-dots.show { opacity: 1; }

    .breath-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(122,158,126,0.25);
      transition: background 0.4s, transform 0.4s;
    }

    .breath-dot.active {
      background: rgba(122,158,126,0.75);
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <!-- Minimal nav -->
  <nav class="r-nav">
    <a href="index.html" class="r-nav__logo">Pacoya</a>
    <a href="index.html" class="r-nav__back">← Volver</a>
  </nav>

  <!-- Mode selector -->
  <div class="mode-selector">
    <button class="mode-btn" data-mode="calma" id="btn-calma">Respiración Calma</button>
    <button class="mode-btn active" data-mode="cuadrada" id="btn-cuadrada">Respiración Cuadrada</button>
  </div>

  <!-- Breathing hero -->
  <section class="breath-hero">
    <canvas id="particles-canvas"></canvas>
    <div class="breath-glow" id="breath-glow"></div>
    <div class="breath-orb"      id="breath-orb"></div>
    <div class="breath-wordmark" id="breath-wordmark">Pacoya</div>
    <div class="breath-label"    id="breath-label">inhala</div>
    <!-- 4 dots for box breathing phases -->
    <div class="breath-dots" id="breath-dots">
      <div class="breath-dot" id="dot-0"></div>
      <div class="breath-dot" id="dot-1"></div>
      <div class="breath-dot" id="dot-2"></div>
      <div class="breath-dot" id="dot-3"></div>
    </div>
  </section>

  <!-- Fade de entrada -->
  <div id="entry-fade" style="position:fixed;inset:0;background:#0e0b07;z-index:9998;transition:opacity 0.9s ease;"></div>

  <script>
    window.addEventListener('load', () => {
      const f = document.getElementById('entry-fade');
      setTimeout(() => { f.style.opacity = '0'; }, 80);
      setTimeout(() => { f.remove(); }, 1000);
    });

    // ── MODES ──
    const MODES = {
      cuadrada: {
        phases: [
          { label: 'inhala',  dur: 4000, pStart: 0, pEnd: 1 },
          { label: 'sostén',  dur: 4000, pStart: 1, pEnd: 1 },
          { label: 'exhala',  dur: 4000, pStart: 1, pEnd: 0 },
          { label: 'sostén',  dur: 4000, pStart: 0, pEnd: 0 },
        ],
        dots: true,
      },
      calma: {
        phases: [
          { label: 'inhala', dur: 4000, pStart: 0, pEnd: 1 },
          { label: 'exhala', dur: 6000, pStart: 1, pEnd: 0 },
        ],
        dots: false,
      },
    };

    let currentMode = 'cuadrada';
    let startTime   = performance.now();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function getBreath(now) {
      const mode   = MODES[currentMode];
      const total  = mode.phases.reduce((s, p) => s + p.dur, 0);
      const elapsed = (now - startTime) % total;

      let acc = 0;
      for (let i = 0; i < mode.phases.length; i++) {
        const ph = mode.phases[i];
        if (elapsed < acc + ph.dur) {
          const t    = (elapsed - acc) / ph.dur;
          const ease = easeInOut(t);
          const p    = ph.pStart + (ph.pEnd - ph.pStart) * ease;
          return { label: ph.label, p, phaseIndex: i };
        }
        acc += ph.dur;
      }
      return { label: mode.phases[0].label, p: 0, phaseIndex: 0 };
    }

    // ── PARTICLES ──
    const canvas = document.getElementById('particles-canvas');
    const ctx    = canvas.getContext('2d');
    let   pts    = [];

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function makePt() {
      const spread = Math.min(window.innerWidth, window.innerHeight) * 0.38;
      return {
        angle:   Math.random() * Math.PI * 2,
        baseR:   90 + Math.random() * spread,
        drift:   (Math.random() - 0.5) * 0.00022,
        size:    0.7 + Math.random() * 1.3,
        opacity: 0.08 + Math.random() * 0.22,
      };
    }

    function initPts() { pts = Array.from({ length: 55 }, makePt); }

    function drawPts(p) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width  / 2;
      const cy = canvas.height / 2;
      pts.forEach(pt => {
        pt.angle += pt.drift;
        const r = pt.baseR * (1 + p * 0.16);
        const x = cx + Math.cos(pt.angle) * r;
        const y = cy + Math.sin(pt.angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, pt.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(122,158,126,${pt.opacity * (0.45 + p * 0.55)})`;
        ctx.fill();
      });
    }

    // ── ANIMATION LOOP ──
    const orbEl   = document.getElementById('breath-orb');
    const wordEl  = document.getElementById('breath-wordmark');
    const labelEl = document.getElementById('breath-label');
    const glowEl  = document.getElementById('breath-glow');
    const dotsEl  = document.getElementById('breath-dots');
    const dotEls  = [0,1,2,3].map(i => document.getElementById(`dot-${i}`));
    let lastLabel = '';

    function animate(now) {
      const { label, p, phaseIndex } = getBreath(now);

      // Orb
      orbEl.style.transform = `scale(${0.68 + 0.32 * p})`;
      orbEl.style.opacity   = String(0.45 + 0.55 * p);

      // Glow
      glowEl.style.opacity  = String(0.35 + 0.65 * p);

      // Wordmark
      wordEl.style.transform     = `scale(${1 + 0.04 * p})`;
      wordEl.style.letterSpacing = `${(0.07 + 0.03 * p).toFixed(3)}em`;
      wordEl.style.opacity       = String(0.5 + 0.4 * p);

      // Label
      if (label !== lastLabel) {
        lastLabel = label;
        labelEl.style.opacity = '0';
        setTimeout(() => {
          labelEl.textContent   = label;
          labelEl.style.opacity = '1';
        }, 300);
      }

      // Box breathing dots
      if (currentMode === 'cuadrada') {
        dotEls.forEach((d, i) => d.classList.toggle('active', i === phaseIndex));
      }

      drawPts(p);
      requestAnimationFrame(animate);
    }

    // ── MODE SWITCHING ──
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        startTime   = performance.now();
        lastLabel   = '';

        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const showDots = MODES[currentMode].dots;
        dotsEl.classList.toggle('show', showDots);
      });
    });

    // ── INIT ──
    resizeCanvas();
    window.addEventListener('resize', () => { resizeCanvas(); initPts(); });
    initPts();

    // Show dots for default mode (cuadrada)
    dotsEl.classList.add('show');

    requestAnimationFrame(animate);
  </script>
</body>
</html>
