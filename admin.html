<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacoya Admin — Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --verde: #7A9E7E;
      --verde-dark: #698d6c;
      --crema: #FAF7F2;
      --tierra: #3D2F22;
      --tierra-claro: #6B5240;
      --dorado: #B5956A;
      --blanco: #FFFFFF;
      --rojo: #e07070;
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--crema);
      color: var(--tierra);
      min-height: 100vh;
    }

    /* LOGIN */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--blanco);
      border-radius: var(--radius);
      padding: 48px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 30px rgba(61,47,34,0.1);
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--verde);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      gap: 1px;
    }

    .login-logo span:first-child {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--blanco);
    }

    .login-logo span:last-child {
      font-size: 0.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }

    .login-card h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 0.9rem;
      color: var(--tierra-claro);
      margin-bottom: 32px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 12px 16px;
      border: 1.5px solid rgba(61,47,34,0.15);
      border-radius: 8px;
      background: var(--crema);
      color: var(--tierra);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--verde); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      gap: 8px;
    }

    .btn--primary { background: var(--verde); color: var(--blanco); width: 100%; }
    .btn--primary:hover { background: var(--verde-dark); }
    .btn--danger { background: rgba(224,112,112,0.1); color: var(--rojo); border: 1px solid rgba(224,112,112,0.3); }
    .btn--danger:hover { background: rgba(224,112,112,0.2); }
    .btn--outline { background: transparent; color: var(--tierra); border: 1.5px solid var(--tierra); }
    .btn--outline:hover { background: var(--tierra); color: var(--crema); }
    .btn--sm { padding: 7px 16px; font-size: 0.82rem; }

    .login-error {
      font-size: 0.82rem;
      color: var(--rojo);
      margin-top: 12px;
      min-height: 20px;
    }

    /* ADMIN PANEL */
    .admin-screen { display: none; }

    .admin-header {
      background: var(--blanco);
      border-bottom: 1px solid rgba(61,47,34,0.08);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--verde);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }

    .admin-logo span:first-child {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--blanco);
    }

    .admin-logo span:last-child {
      font-size: 0.28rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 400;
    }

    .admin-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .admin-top h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 400;
    }

    /* FORM EVENTO */
    .evento-form {
      background: var(--blanco);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 32px;
      border: 1px solid rgba(122,158,126,0.2);
      display: none;
    }

    .evento-form.open { display: block; }

    .evento-form h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    .form-group select {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 12px 16px;
      border: 1.5px solid rgba(61,47,34,0.15);
      border-radius: 8px;
      background: var(--crema);
      color: var(--tierra);
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }

    .form-group select:focus { border-color: var(--verde); }

    .form-group textarea {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 12px 16px;
      border: 1.5px solid rgba(61,47,34,0.15);
      border-radius: 8px;
      background: var(--crema);
      color: var(--tierra);
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .form-group textarea:focus { border-color: var(--verde); }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    /* LISTA EVENTOS */
    .eventos-lista { display: flex; flex-direction: column; gap: 12px; }

    .evento-item {
      background: var(--blanco);
      border-radius: var(--radius);
      padding: 20px 24px;
      border: 1px solid rgba(61,47,34,0.07);
      display: flex;
      align-items: center;
      gap: 20px;
      transition: box-shadow 0.2s;
    }

    .evento-item:hover { box-shadow: 0 4px 20px rgba(61,47,34,0.08); }

    .evento-fecha {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 48px;
    }

    .evento-dia {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 300;
      line-height: 1;
      color: var(--tierra);
    }

    .evento-mes {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--verde);
    }

    .evento-info { flex: 1; }

    .evento-info h4 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .evento-info p {
      font-size: 0.82rem;
      color: var(--tierra-claro);
    }

    .evento-tipo {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--verde);
      background: rgba(122,158,126,0.1);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .evento-acciones { display: flex; gap: 8px; }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--tierra-claro);
      background: var(--blanco);
      border-radius: var(--radius);
      border: 1px dashed rgba(61,47,34,0.15);
    }

    .empty-state p { font-size: 0.9rem; margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--tierra);
      color: var(--crema);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <span>Pacoya</span>
        <span>yoga studio</span>
      </div>
      <h1>Panel de administración</h1>
      <p>Ingresa tu contraseña para continuar</p>
      <form id="login-form">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary">Entrar</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-screen" id="admin-screen">
    <header class="admin-header">
      <div class="admin-header-left">
        <div class="admin-logo">
          <span>Pacoya</span>
          <span>yoga studio</span>
        </div>
        <span class="admin-title">Panel de administración</span>
      </div>
      <button class="btn btn--outline btn--sm" id="logout-btn">Cerrar sesión</button>
    </header>

    <main class="admin-main">
      <div class="admin-top">
        <h2>Próximos Eventos</h2>
        <button class="btn btn--primary btn--sm" id="toggle-form-btn">+ Nuevo evento</button>
      </div>

      <!-- FORMULARIO -->
      <div class="evento-form" id="evento-form">
        <h3 id="form-title">Nuevo evento</h3>
        <input type="hidden" id="evento-id" />
        <div class="form-grid">
          <div class="form-group full">
            <label>Título del evento</label>
            <input type="text" id="f-titulo" placeholder="Ej. Taller de Yoga Oncológico" />
          </div>
          <div class="form-group full">
            <label>Descripción</label>
            <textarea id="f-descripcion" rows="3" placeholder="Describe el evento..."></textarea>
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="f-fecha" />
          </div>
          <div class="form-group">
            <label>Hora</label>
            <input type="text" id="f-hora" placeholder="Ej. 10:00 AM" />
          </div>
          <div class="form-group">
            <label>Lugar</label>
            <input type="text" id="f-lugar" placeholder="Ej. Estudio Pacoya / En línea" />
          </div>
          <div class="form-group">
            <label>Tipo</label>
            <select id="f-tipo">
              <option value="meditacion">Meditación</option>
              <option value="especial">Taller especial</option>
              <option value="taller">Taller</option>
              <option value="retiro">Retiro</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn--outline btn--sm" id="cancelar-btn">Cancelar</button>
          <button class="btn btn--primary btn--sm" id="guardar-btn">Guardar evento</button>
        </div>
      </div>

      <!-- LISTA -->
      <div class="eventos-lista" id="eventos-lista"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://kzqtjzzpyhmzdlczsbnz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_s3eWk4Z4L31DlyLyYbHbYw_jrpMV7-z';
    const ADMIN_PASSWORD = 'pacoya2026';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginScreen  = document.getElementById('login-screen');
    const adminScreen  = document.getElementById('admin-screen');
    const loginForm    = document.getElementById('login-form');
    const loginError   = document.getElementById('login-error');
    const logoutBtn    = document.getElementById('logout-btn');
    const toggleBtn    = document.getElementById('toggle-form-btn');
    const eventoForm   = document.getElementById('evento-form');
    const cancelarBtn  = document.getElementById('cancelar-btn');
    const guardarBtn   = document.getElementById('guardar-btn');
    const eventosList  = document.getElementById('eventos-lista');
    const toast        = document.getElementById('toast');

    // LOGIN
    if (sessionStorage.getItem('pacoya-admin')) showAdmin();

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      if (pwd === ADMIN_PASSWORD) {
        sessionStorage.setItem('pacoya-admin', '1');
        showAdmin();
      } else {
        loginError.textContent = 'Contraseña incorrecta.';
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('pacoya-admin');
      adminScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
    });

    function showAdmin() {
      loginScreen.style.display = 'none';
      adminScreen.style.display = 'block';
      cargarEventos();
    }

    // FORM TOGGLE
    toggleBtn.addEventListener('click', () => {
      limpiarForm();
      document.getElementById('form-title').textContent = 'Nuevo evento';
      eventoForm.classList.add('open');
    });

    cancelarBtn.addEventListener('click', () => {
      eventoForm.classList.remove('open');
      limpiarForm();
    });

    // GUARDAR
    guardarBtn.addEventListener('click', async () => {
      const id     = document.getElementById('evento-id').value;
      const titulo = document.getElementById('f-titulo').value.trim();
      const fecha  = document.getElementById('f-fecha').value;

      if (!titulo || !fecha) {
        mostrarToast('El título y la fecha son obligatorios.');
        return;
      }

      const datos = {
        titulo,
        descripcion: document.getElementById('f-descripcion').value.trim(),
        fecha,
        hora:   document.getElementById('f-hora').value.trim(),
        lugar:  document.getElementById('f-lugar').value.trim(),
        tipo:   document.getElementById('f-tipo').value,
      };

      if (id) {
        await supabase.from('eventos').update(datos).eq('id', id);
        mostrarToast('✓ Evento actualizado');
      } else {
        await supabase.from('eventos').insert(datos);
        mostrarToast('✓ Evento creado');
      }

      eventoForm.classList.remove('open');
      limpiarForm();
      cargarEventos();
    });

    // CARGAR EVENTOS
    async function cargarEventos() {
      const { data } = await supabase
        .from('eventos')
        .select('*')
        .order('fecha', { ascending: true });

      eventosList.innerHTML = '';

      if (!data || data.length === 0) {
        eventosList.innerHTML = `
          <div class="empty-state">
            📅
            <p>No hay eventos aún. Crea el primero con el botón de arriba.</p>
          </div>`;
        return;
      }

      data.forEach(ev => {
        const fecha = new Date(ev.fecha + 'T12:00:00');
        const dia   = fecha.getDate();
        const mes   = fecha.toLocaleString('es-MX', { month: 'short' });

        const item = document.createElement('div');
        item.className = 'evento-item';
        item.innerHTML = `
          <div class="evento-fecha">
            <span class="evento-dia">${dia}</span>
            <span class="evento-mes">${mes}</span>
          </div>
          <div class="evento-info">
            <h4>${ev.titulo}</h4>
            <p>${ev.hora ? ev.hora + ' · ' : ''}${ev.lugar || ''}</p>
          </div>
          <span class="evento-tipo">${ev.tipo}</span>
          <div class="evento-acciones">
            <button class="btn btn--outline btn--sm" onclick="editarEvento(${ev.id})">Editar</button>
            <button class="btn btn--danger btn--sm" onclick="borrarEvento(${ev.id})">Borrar</button>
          </div>`;
        eventosList.appendChild(item);
      });
    }

    // EDITAR
    window.editarEvento = async (id) => {
      const { data } = await supabase.from('eventos').select('*').eq('id', id).single();
      document.getElementById('evento-id').value        = data.id;
      document.getElementById('f-titulo').value         = data.titulo;
      document.getElementById('f-descripcion').value    = data.descripcion || '';
      document.getElementById('f-fecha').value          = data.fecha;
      document.getElementById('f-hora').value           = data.hora || '';
      document.getElementById('f-lugar').value          = data.lugar || '';
      document.getElementById('f-tipo').value           = data.tipo || 'taller';
      document.getElementById('form-title').textContent = 'Editar evento';
      eventoForm.classList.add('open');
      eventoForm.scrollIntoView({ behavior: 'smooth' });
    };

    // BORRAR
    window.borrarEvento = async (id) => {
      if (!confirm('¿Segura que quieres borrar este evento?')) return;
      await supabase.from('eventos').delete().eq('id', id);
      mostrarToast('Evento eliminado');
      cargarEventos();
    };

    function limpiarForm() {
      ['evento-id','f-titulo','f-descripcion','f-fecha','f-hora','f-lugar'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('f-tipo').value = 'meditacion';
    }

    function mostrarToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
